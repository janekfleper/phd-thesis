gorg_exploring_2019:
  type: thesis
  title: Exploring and Floquet-Engineering the Driven Fermi-Hubbard Model with Ultracold Atoms
  author: Görg, Frederik
  date: 2019
  organization: "{ETH} Zurich"
  url:
    value: https://www.research-collection.ethz.ch/handle/20.500.11850/361822
    date: 2020-01-30
  serial-number:
    doi: 10.3929/ethz-b-000361822
  abstract: This thesis reports on the experimental realization and investigation of the driven Fermi-Hubbard model with ultracold fermionic atoms in optical lattices. It is demonstrated that the outstanding challenge of heating in driven quantum many-body systems can be overcome, which enables to achieve low-temperature states that feature for example tunable magnetic correlations. In a set of experiments, we establish the description of such strongly correlated, time-periodic systems by means of effective static Hamiltonians. This Floquet-engineering approach allows for a quantum simulation of a large variety of many-body models, which go well beyond the scope of condensed matter physics. In order to push the boundaries of the field in the context of high-energy physics, a scheme to couple dynamical gauge fields to matter is proposed and experimentally implemented. The driven Fermi-Hubbard model is realized by loading interacting potassium-40 atoms into a tunable lattice consisting of optical standing waves and subsequently modulating the lattice position periodically in time. A key to suppress heating and loss of atoms induced by the drive is to engineer the dispersion of higher bands in the lattice. We investigate the charge and magnetic properties of the driven many-body state for a large range of interactions and driving strengths. Two different regimes are considered, in which the modulation frequencies is either much higher than all static energy scales or close to the Hubbard onsite interaction. In the near-resonant regime, we demonstrate that anti-ferromagnetic spin correlations can be enhanced compared to the static case or even switched to ferromagnetic ordering, while an off-resonant drive is found to reduce correlations. Using Floquet theory, we derive effective many-body Hamiltonians for the two modulation regimes, which feature new terms that cannot be realized in static systems. In particular, if the modulation frequency is close to the interaction energy, density-assisted hopping processes and hence the magnetic exchange energy can be tuned independently from the single particle tunneling. Furthermore, we investigate the dynamics of driven many-body systems by varying the modulation time over several orders of magnitude. The validity of the description in terms of an effective Hamiltonian is demonstrated for experimentally relevant timescales of up to hundreds of tunneling times. This verification of the Floquet-engineering approach for interacting systems is achieved by comparing the time evolution in driven systems to equivalent implementations of the effective Hamiltonian in a static lattice. In addition, we benchmark the experimental observations against non-equilibrium dynamical mean field theory calculations. Using this control and understanding of the driven Fermi-Hubbard model, we experimentally realize Peierls phases that depend on the occupations of the lattice sites. To this end, we propose and implement a two-frequency driving scheme, which explicitly breaks time-reversal symmetry and hence enables to engineer complex-valued density-assisted tunneling matrix elements. We demonstrate measurement protocols in a Hubbard dimer, which allow to quantify the magnitude of the induced density-assisted tunnel coupling and to directly measure its Peierls phase compared to the single particle tunneling. These experiments constitute the first step towards the simulation of dynamical gauge fields and lattice gauge theories with ultracold atoms in optical lattices.
jaksch_cold_2005:
