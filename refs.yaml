lee_doping_2006-1:
  type: article
  title:
    value: "Doping a Mott insulator: Physics of high-temperature superconductivity"
    short: Doping a Mott insulator
  author:
    - Lee, Patrick A.
    - Nagaosa, Naoto
    - Wen, Xiao-Gang
  date: 2006-01-06
  page-range: 17-85
  url:
    value: https://link.aps.org/doi/10.1103/RevModPhys.78.17
    date: 2025-11-16
  serial-number:
    doi: 10.1103/RevModPhys.78.17
  note: "Publisher: American Physical Society"
  abstract: This article reviews the physics of high-temperature superconductors from the point of view of the doping of a Mott insulator. The basic electronic structure of cuprates is reviewed, emphasizing the physics of strong correlation and establishing the model of a doped Mott insulator as a starting point. A variety of experiments are discussed, focusing on the region of the phase diagram close to the Mott insulator (the underdoped region) where the behavior is most anomalous. The normal state in this region exhibits pseudogap phenomenon. In contrast, the quasiparticles in the superconducting state are well defined and behave according to theory. This review introduces Anderson’s idea of the resonating valence bond and argues that it gives a qualitative account of the data. The importance of phase fluctuations is discussed, leading to a theory of the transition temperature, which is driven by phase fluctuations and the thermal excitation of quasiparticles. However, an argument is made that phase fluctuations can only explain pseudogap phenomenology over a limited temperature range, and some additional physics is needed to explain the onset of singlet formation at very high temperatures. A description of the numerical method of the projected wave function is presented, which turns out to be a very useful technique for implementing the strong correlation constraint and leads to a number of predictions which are in agreement with experiments. The remainder of the paper deals with an analytic treatment of the 𝑡−𝐽 model, with the goal of putting the resonating valence bond idea on a more formal footing. The slave boson is introduced to enforce the constraint againt double occupation and it is shown that the implementation of this local constraint leads naturally to gauge theories. This review follows the historical order by first examining the U(1) formulation of the gauge theory. Some inadequacies of this formulation for underdoping are discussed, leading to the {SU}(2) formulation. Here follows a rather thorough discussion of the role of gauge theory in describing the spin-liquid phase of the undoped Mott insulator. The difference between the high-energy gauge group in the formulation of the problem versus the low-energy gauge group, which is an emergent phenomenon, is emphasized. Several possible routes to deconfinement based on different emergent gauge groups are discussed, which leads to the physics of fractionalization and spin-charge separation. Next the extension of the {SU}(2) formulation to nonzero doping is described with a focus on a part of the mean-field phase diagram called the staggered flux liquid phase. It will be shown that inclusion of the gauge fluctuation provides a reasonable description of the pseudogap phase. It is emphasized that 𝑑-wave superconductivity can be considered as evolving from a stable U(1) spin liquid. These ideas are applied to the high-𝑇𝑐 cuprates, and their implications for the vortex structure and the phase diagram are discussed. A possible test of the topological structure of the pseudogap phase is described.
  parent:
