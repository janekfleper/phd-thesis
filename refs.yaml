    isbn: 978-1-4612-6928-1
  note: "Google-Books-{ID}: {ytgXkgEACAAJ}"
  abstract: "In the excitement and rapid pace of developments, writing pedagogical texts has low priority for most researchers. However, in transforming my lecture l notes into this book, I found a personal benefit: the organization of what I understand in a (hopefully simple) logical sequence. Very little in this text is my original contribution. Most of the knowledge was collected from the research literature. Some was acquired by conversations with colleagues; a kind of physics oral tradition passed between disciples of a similar faith. For many years, diagramatic perturbation theory has been the major theoretical tool for treating interactions in metals, semiconductors, itiner ant magnets, and superconductors. It is in essence a weak coupling expan sion about free quasiparticles. Many experimental discoveries during the last decade, including heavy fermions, fractional quantum Hall effect, high temperature superconductivity, and quantum spin chains, are not readily accessible from the weak coupling point of view. Therefore, recent years have seen vigorous development of alternative, nonperturbative tools for handling strong electron-electron interactions. I concentrate on two basic paradigms of strongly interacting (or con strained) quantum systems: the Hubbard model and the Heisenberg model. These models are vehicles for fundamental concepts, such as effective Ha miltonians, variational ground states, spontaneous symmetry breaking, and quantum disorder. In addition, they are used as test grounds for various nonperturbative approximation schemes that have found applications in diverse areas of theoretical physics."
di_salvo_topological_2024:
  type: article
  title:
    value: "Topological phases of the interacting Su-Schrieffer-Heeger model: An analytical study"
    short: Topological phases of the interacting Su-Schrieffer-Heeger model
  author:
    - Di Salvo, E.
    - Moustaj, A.
    - Xu, C.
    - Fritz, L.
    - Mitchell, A. K.
    - Smith, C. Morais
    - Schuricht, D.
  date: 2024-10-18
  page-range: "165145"
  url:
    value: https://link.aps.org/doi/10.1103/PhysRevB.110.165145
    date: 2025-08-08
  serial-number:
    doi: 10.1103/PhysRevB.110.165145
  note: "Publisher: American Physical Society"
  abstract: "The interacting {SSH} model provides an ideal ground to study the interplay between topologically insulating phases and electron-electron interactions. We study the polarization density as a topological invariant and provide an analytic treatment of its behavior in the low-energy sector of the one-dimensional interacting {SSH} model. By formulating the topological invariant in terms of Green's functions, we use the low-energy field theory of the Thirring model to derive the behavior of the polarization density. We show that polarization density in the continuum theory describes the usual topological insulating phases. Still, it contains an extra factor from the fields' scaling dimensions in the low-energy quantum field theory. We interpret this as a measure of the modified charge of the new excitations in the system. We find two distinct contributions: a renormalization of the electronic charge 𝑒 of a Fermi liquid because of quasiparticle smearing and an additional contribution coming from the topological charge of the soliton arising in the bosonized version of the Thirring model, the sine-Gordon model."
  parent:
    type: periodical
    title: Physical Review B
    issue: 16
    volume: 110
