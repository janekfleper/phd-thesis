  serial-number:
    doi: 10.1103/PhysRevLett.76.10
  note: "Publisher: American Physical Society"
  abstract: We study the prospects for observing superfluidity in a spin-polarized atomic gas of 6⁢Li atoms, using state-of-the-art interatomic potentials. We determine the spinodal line and show that a {BCS} transition to the superfluid state can indeed occur in the (meta)stable region of the phase diagram if the densities are sufficiently low. We also discuss the stability of the gas due to exchange and dipolar relaxation and conclude that the prospects for observing superfluidity in a magnetically trapped atomic 6⁢Li gas are particularly promising for magnetic bias fields larger than 10 T.
  parent:
    type: periodical
    title: Physical Review Letters
    issue: 1
    volume: 76
baranov_critical_1998:
  type: article
  title: Critical temperature and Ginzburg-Landau equation for a trapped Fermi gas
  author:
    - Baranov, M. A.
    - Petrov, D. S.
  date: 1998-08-01
  page-range: R801-R804
  url:
    value: https://link.aps.org/doi/10.1103/PhysRevA.58.R801
    date: 2025-10-27
  serial-number:
    doi: 10.1103/PhysRevA.58.R801
  note: "Publisher: American Physical Society"
  abstract: We discuss a superfluid phase transition in a trapped neutral-atom Fermi gas. We consider the case where the critical temperature greatly exceeds the spacing between the trap levels and derive the corresponding Ginzburg-Landau equation. The latter turns out to be analogous to the equation for the condensate wave function in a trapped Bose gas. The analysis of its solution provides us with the value of the critical temperature 𝑇𝑐 and with the spatial and temperature dependence of the order parameter in the vicinity of the phase transition point.
  parent:
    type: periodical
    title: Physical Review A
    issue: 2
    volume: 58
phillips_laser_1982:
  type: article
  title: Laser Deceleration of an Atomic Beam
  author:
    - Phillips, William D.
    - Metcalf, Harold
  date: 1982-03-01
  page-range: 596-599
  url:
    value: https://link.aps.org/doi/10.1103/PhysRevLett.48.596
    date: 2025-10-27
  serial-number:
    doi: 10.1103/PhysRevLett.48.596
  note: "Publisher: American Physical Society"
  abstract: Deceleration and velocity bunching of Na atoms in an atomic beam have been observed. The deceleration, caused by absorption of counterpropagating resonant laser light, amounts to 40% of the initial thermal velocity, corresponding to about 15 000 absorptions. Atoms were kept in resonance with the laser by using a spatially varying magnetic field to provide a changing Zeeman shift to compensate for the changing Doppler shift as the atoms decelerated.
  parent:
    type: periodical
    title: Physical Review Letters
    issue: 9
    volume: 48
hess_evaporative_1986:
  type: article
  title: Evaporative cooling of magnetically trapped and compressed spin-polarized hydrogen
  author: Hess, Harald F.
  date: 1986-09-01
  page-range: 3476-3479
  url:
    value: https://link.aps.org/doi/10.1103/PhysRevB.34.3476
    date: 2025-10-27
  serial-number:
    doi: 10.1103/PhysRevB.34.3476
  note: "Publisher: American Physical Society"
  abstract: A gas of spin-polarized atomic hydrogen can be prepared in the upper hyperfine states and loaded into a static magnetic trap. Evaporative cooling and magnetic compression of such a gas can produce temperatures of 30 μK and densities of 1014 cm−3. Under these conditions a Bose-Einstein condensate may form.
  parent:
    type: periodical
    title: Physical Review B
    issue: 5
    volume: 34
timmermans_superfluidity_1998:
  type: article
  title: Superfluidity in Sympathetic Cooling with Atomic Bose-Einstein Condensates
  author:
    - Timmermans, Eddy
    - Côté, Robin
  date: 1998-04-20
  page-range: 3419-3423
  url:
    value: https://link.aps.org/doi/10.1103/PhysRevLett.80.3419
    date: 2025-10-27
  serial-number:
    doi: 10.1103/PhysRevLett.80.3419
  note: "Publisher: American Physical Society"
  abstract: The dynamical structure of an atomic Bose-Einstein condensate limits the efficiency of the condensate in cooling slow impurity atoms. To illustrate the point, we show that an impurity atom moving in a homogeneous zero-temperature condensate is not scattered incoherently if its velocity is lower than the condensate sound velocity 𝑐, limiting cooling to velocities 𝑣 ≥𝑐. This striking effect is an expression of superfluidity and provides a direct means to detect the fundamental property of superfluidity in atomic condensates. Furthermore, we show that the fermionic lithium isotope, 6⁢Li, is a reasonable candidate for sympathetic cooling by a 23⁢Na condensate.
  parent:
    type: periodical
    title: Physical Review Letters
    issue: 16
    volume: 80
pritchard_cooling_1983:
  type: article
  title: Cooling Neutral Atoms in a Magnetic Trap for Precision Spectroscopy
  author: Pritchard, David E.
  date: 1983-10-10
  page-range: 1336-1339
  url:
    value: https://link.aps.org/doi/10.1103/PhysRevLett.51.1336
    date: 2025-10-27
  serial-number:
    doi: 10.1103/PhysRevLett.51.1336
  note: "Publisher: American Physical Society"
  abstract: A configuration of magnetic fields is exhibited which can harmonically trap paramagnetic particles in a shallow field minimum, superposed on a nearly uniform field which simplifies spectroscopic interactions with the particles. The potential energy of a trapped neutral particle depends on the particle's internal quantum number, as well as its position in the trap, permitting a combined rf-laser optical pumping cycle which can cool particles by a factor of 2 per cycle. Application of these ideas to the trapping of Na atoms is discussed.
  parent:
    type: periodical
    title: Physical Review Letters
    issue: 15
    volume: 51
mewes_bose-einstein_1996:
  type: article
  title: Bose-Einstein Condensation in a Tightly Confining dc Magnetic Trap
  author:
    - Mewes, M.-O.
    - Andrews, M. R.
    - name: Druten
      given-name: N. J.
      prefix: van
    - Kurn, D. M.
    - Durfee, D. S.
    - Ketterle, W.
  date: 1996-07-15
  page-range: 416-419
  url:
    value: https://link.aps.org/doi/10.1103/PhysRevLett.77.416
    date: 2025-10-27
  serial-number:
    doi: 10.1103/PhysRevLett.77.416
  note: "Publisher: American Physical Society"
  abstract: Bose-Einstein condensation of sodium atoms has been observed in a novel “cloverleaf” trap. This trap combines tight confinement with excellent optical access, using only dc electromagnets. Evaporative cooling in this trap produced condensates of 5 ×106 atoms, a tenfold improvement over previous results. We measured the condensate fraction and the repulsive mean-field energy, finding agreement with theoretical predictions.
  parent:
    type: periodical
    title: Physical Review Letters
    issue: 3
    volume: 77
schrader_optical_2001:
  type: article
  title: An optical conveyor belt for single neutral atoms
  author:
    - Schrader, D.
    - Kuhr, S.
    - Alt, W.
    - Müller, M.
    - Gomer, V.
    - Meschede, D.
  date: 2001-12-01
  page-range: 819-824
  url:
    value: https://doi.org/10.1007/s003400100722
    date: 2025-10-28
  serial-number:
    doi: 10.1007/s003400100722
    issn: 1432-0649
  abstract: Using optical dipole forces we have realized controlled transport of a single or any desired small number of neutral atoms over a distance of a centimeter with sub-micrometer precision. A standing wave dipole trap is loaded with a prescribed number of cesium atoms from a magneto-optical trap. Mutual detuning of the counter-propagating laser beams moves the interference pattern, allowing us to accelerate and stop the atoms at preselected points along the standing wave. The transportation efficiency is close to 100%. This optical ‘single-atom conveyor belt’ represents a versatile tool for future experiments requiring deterministic delivery of a prescribed number of atoms on demand.
  parent:
    type: periodical
    title: Applied Physics B
    issue: 8
    volume: 73
matthies_long-distance_2024:
  type: article
  title: Long-distance optical-conveyor-belt transport of ultracold Cs133 and Rb87 atoms
  author:
    - Matthies, Alex J.
    - Mortlock, Jonathan M.
    - McArd, Lewis A.
    - Raghuram, Adarsh P.
    - Innes, Andrew D.
    - Gregory, Philip D.
    - Bromley, Sarah L.
    - Cornish, Simon L.
  date: 2024-02-15
  page-range: "23321"
  url:
    value: https://link.aps.org/doi/10.1103/PhysRevA.109.023321
    date: 2025-10-28
  serial-number:
    doi: 10.1103/PhysRevA.109.023321
  note: "Publisher: American Physical Society"
  abstract: We report on the transport of a thermal cloud of ultracold cesium and rubidium atoms over about 37 cm in under 25 ms using an optical conveyor belt formed by two counterpropagating beams with a controllable frequency difference that generate a movable optical lattice. By carefully selecting the waists and focus positions, we are able to use two static Gaussian beams for the transport, avoiding the need for a Bessel beam or variable-focus lenses. We characterize the transport efficiency for both species, including a comparison of different transport trajectories, gaining insight into the loss mechanisms and finding the minimum jerk trajectory to be optimum. Using the optimized parameters, we are able to transport up to 7×106 cesium or rubidium atoms with an efficiency up to 75%. To demonstrate the viability of our transport scheme for experiments employing quantum gas microscopy, we produce Bose-Einstein condensates of either species after transport and present measurements of the simultaneous transport of both species.
  parent:
    type: periodical
    title: Physical Review A
    issue: 2
    volume: 109
fallani_bose-einstein_2005:
  type: article
  title:
    value: "Bose-Einstein condensate in an optical lattice with tunable spacing: transport and static properties"
    short: Bose-Einstein condensate in an optical lattice with tunable spacing
  author:
    - Fallani, Leonardo
    - Fort, Chiara
    - Lye, Jessica E.
    - Inguscio, Massimo
  date: 2005-05-30
  page-range: 4303-4313
  url:
    value: https://opg.optica.org/oe/abstract.cfm?uri=oe-13-11-4303
    date: 2025-10-28
  serial-number:
    doi: 10.1364/OPEX.13.004303
    issn: 1094-4087
  note: "Publisher: Optica Publishing Group"
  abstract: In this Letter we report the investigation of transport and static properties of a Bose-Einstein condensate in a large-spaced optical lattice. The lattice spacing can be easily tuned starting from few micrometers by adjusting the relative angle of two partially reflective mirrors. We have performed in-situ imaging of the atoms trapped in the potential wells of a 20 µm spaced lattice. For a lattice spacing of 10 µm we have studied the transport properties of the system and the interference pattern after expansion, evidencing quite different results with respect to the physics of {BECs} in ordinary near-infrared standing wave lattices, owing to the different length and energy scales.
  parent:
    type: periodical
    title: Optics Express
    issue: 11
    volume: 13
mazurenko_cold-atom_2017:
  type: article
  title: A cold-atom Fermi–Hubbard antiferromagnet
  author:
    - Mazurenko, Anton
    - Chiu, Christie S.
    - Ji, Geoffrey
    - Parsons, Maxwell F.
    - Kanász-Nagy, Márton
    - Schmidt, Richard
    - Grusdt, Fabian
    - Demler, Eugene
    - Greif, Daniel
    - Greiner, Markus
  date: 2017-05
  page-range: 462-466
  url:
    value: https://www.nature.com/articles/nature22362
    date: 2025-10-28
  serial-number:
    doi: 10.1038/nature22362
    issn: 1476-4687
  note: "Publisher: Nature Publishing Group"
  abstract: An antiferromagnet with a correlation length that encompasses the whole system is created with the aid of quantum gas microscopy of cold atoms in an optical lattice.
  parent:
    type: periodical
    title: Nature
    issue: 7655
    volume: 545
jordens_mott_2008:
  type: article
  title: A Mott insulator of fermionic atoms in an optical lattice
  author:
    - Jördens, Robert
    - Strohmaier, Niels
    - Günter, Kenneth
    - Moritz, Henning
    - Esslinger, Tilman
  date: 2008-09
  page-range: 204-207
  url:
    value: https://www.nature.com/articles/nature07244
    date: 2025-10-28
  serial-number:
    doi: 10.1038/nature07244
    issn: 1476-4687
  note: "Publisher: Nature Publishing Group"
  abstract: In a Mott insulator, suppression of conductivity occurs as a result of electron interactions. Proximity to this phase causes intriguing phenomena in fermionic condensed matter systems, most notably high-temperature superconductivity. The Hubbard model, which encompasses the essential physics of the Mott insulator, can be realized with quantum gases trapped in an optical lattice. Therefore, experimental tools developed in atomic physics can be used to study this regime. However, an atomic Mott insulator has so far been realized only with a gas of bosons, which lack the rich and peculiar nature of fermions. The authors report the formation of a Mott insulator of a repulsively interacting two-component Fermi gas in an optical lattice. The results pave the way for further studies of the Mott insulator, including spin-ordering and ultimately the question of d-wave superfluidity.
  parent:
    type: periodical
    title: Nature
    issue: 7210
    volume: 455
becker_ultracold_2010:
  type: article
  title: Ultracold quantum gases in triangular optical lattices
  author:
    - Becker, C
    - Soltan-Panahi, P
    - Kronjäger, J
    - Dörscher, S
    - Bongs, K
    - Sengstock, K
  date: 2010-06
  page-range: "65025"
  url:
    value: https://doi.org/10.1088/1367-2630/12/6/065025
    date: 2025-10-28
  serial-number:
    doi: 10.1088/1367-2630/12/6/065025
    issn: 1367-2630
  abstract: Over recent years, exciting developments in the field of ultracold atoms confined in optical lattices have led to numerous theoretical proposals devoted to the quantum simulation of problems e.g. known from condensed matter physics. Many of those ideas demand experimental environments with non-cubic lattice geometries. In this paper, we report on the implementation of a versatile three-beam lattice allowing for the generation of triangular as well as hexagonal optical lattices. As an important step, the superfluid–Mott insulator ({SF}–{MI}) quantum phase transition has been observed and investigated in detail in this lattice geometry for the first time. In addition to this, we study the physics of spinor Bose–Einstein condensates ({BEC}) in the presence of the triangular optical lattice potential, especially spin changing dynamics across the {SF}–{MI} transition. Our results suggest that, below the {SF}–{MI} phase transition, a well-established mean-field model describes the observed data when renormalizing the spin-dependent interaction. Interestingly, this opens up new perspectives for a lattice-driven tuning of a spin dynamics resonance occurring through the interplay of the quadratic Zeeman effect and spin-dependent interaction. Finally, we discuss further lattice configurations that can be realized with our setup.
  parent:
    type: periodical
    title: New Journal of Physics
    issue: 6
    volume: 12
lohse_thouless_2016:
  type: article
  title: A Thouless quantum pump with ultracold bosonic atoms in an optical superlattice
  author:
    - Lohse, M.
    - Schweizer, C.
    - Zilberberg, O.
    - Aidelsburger, M.
    - Bloch, I.
  date: 2016-04
  page-range: 350-354
  url:
    value: https://www.nature.com/articles/nphys3584
    date: 2025-10-29
  serial-number:
    doi: 10.1038/nphys3584
    issn: 1745-2481
  note: "Publisher: Nature Publishing Group"
  abstract: Topological charge pumping enables the transport of charge through an adiabatic cyclic evolution of the underlying Hamiltonian. In contrast to classical transport, the transported charge is quantized and purely determined by the topology of the pump cycle, making it robust to perturbations. Here, we report on the realization of such a pump with ultracold bosonic atoms forming a Mott insulator in a dynamically controlled optical superlattice. By taking in situ images of the cloud, we observe a quantized deflection per pump cycle. We reveal the pump’s genuine quantum nature by showing that, in contrast to ground-state particles, a counterintuitive reversed deflection occurs for particles in the first excited band. Furthermore, we directly demonstrate that the system undergoes a controlled topological transition in higher bands when tuning the superlattice parameters. These results open a route to the implementation of more complex pumping schemes, including spin degrees of freedom and higher dimensions.
  parent:
    type: periodical
    title: Nature Physics
    issue: 4
    volume: 12
wili_accordion_2023:
  type: article
  title: An accordion superlattice for controlling atom separation in optical potentials
  author:
    - Wili, Simon
    - Esslinger, Tilman
    - Viebahn, Konrad
  date: 2023-04
  page-range: "33037"
  url:
    value: https://doi.org/10.1088/1367-2630/acc5ab
    date: 2025-10-29
  serial-number:
    doi: 10.1088/1367-2630/acc5ab
    issn: 1367-2630
  note: "Publisher: {IOP} Publishing"
  abstract: "We propose a method for separating trapped atoms in optical lattices by large distances. The key idea is the cyclic transfer of atoms between two lattices of variable spacing, known as accordion lattices, each covering at least a factor of two in lattice spacing. By coherently loading atoms between the two superimposed potentials, we can reach, in principle, arbitrarily large atom separations, while requiring only a relatively small numerical aperture. Numerical simulations of our ‘accordion superlattice’ show that the atoms remain localized to one lattice site throughout the separation process, even for moderate lattice depths. In a proof-of-principle experiment, we demonstrate the optical fields required for the accordion superlattice using acousto-optic deflectors. The method can be applied to neutral-atom quantum computing with optical tweezers, as well as quantum simulation of low-entropy many-body states. For instance, a unit-filling atomic Mott insulator can be coherently expanded by a factor of ten in order to load an optical tweezer array with very high filling. In turn, sorted tweezer arrays can be compressed to form high-density states of ultracold atoms in optical lattices. The method can also be applied to biological systems where dynamical separation of particles is required. Video Abstract: An accordion superlattice for controlling atom separation in optical potentials"
  parent:
    type: periodical
    title: New Journal of Physics
    issue: 3
    volume: 25
weitenberg_tailoring_2021:
  type: article
  title: Tailoring quantum gases by Floquet engineering
  author:
    - Weitenberg, Christof
    - Simonet, Juliette
  date: 2021-12
  page-range: 1342-1348
  url:
    value: https://www.nature.com/articles/s41567-021-01316-x
    date: 2025-10-29
  serial-number:
    doi: 10.1038/s41567-021-01316-x
    issn: 1745-2481
  note: "Publisher: Nature Publishing Group"
  abstract: Floquet engineering is the concept of tailoring a system by a periodic drive, and it is increasingly employed in many areas of physics. Ultracold atoms in optical lattices offer a particularly large toolbox to design a variety of driving schemes. A strong motivation for developing these methods is the prospect to study the interplay between topology and interactions in a system where both ingredients are fully tunable. We review the recent successes of Floquet engineering in realizing new classes of Hamiltonians in quantum gases, such as Hamiltonians including artificial gauge fields, topological band structures and density-dependent tunnelling. The creation of periodically driven systems also gives rise to phenomena without static counterparts such as anomalous Floquet topological insulators. We discuss the challenges facing the field, particularly the control of heating mechanisms, which currently limit the preparation of many-body phases, as well as the potential future developments as these obstacles are overcome.
  parent:
    type: periodical
    title: Nature Physics
    issue: 12
    volume: 17
hansch_cooling_1975:
  type: article
  title: Cooling of gases by laser radiation
  author:
    - Hänsch, T. W.
    - Schawlow, A. L.
  date: 1975-01-01
  page-range: 68-69
  url:
    value: https://www.sciencedirect.com/science/article/pii/0030401875901595
    date: 2025-10-31
  serial-number:
    doi: 10.1016/0030-4018(75)90159-5
    issn: 0030-4018
  abstract: It is shown that a low-density gas can be cooled by illuminating it with intense, quasi-monochromatic light confined to the lower-frequency half of a resonance line's Doppler width. Translational kinetic energy can be transferred from the gas to the scattered light, until the atomic velocity is reduced by the ratio of the Doppler width to the natural line width.
  parent:
    type: periodical
    title: Optics Communications
    issue: 1
    volume: 13
ashkin_cooling_1979:
  type: article
  title: Cooling and trapping of atoms by resonance radiation pressure
  author:
    - Ashkin, A.
    - Gordon, J. P.
  date: 1979-06-01
  page-range: 161-163
  url:
    value: https://opg.optica.org/ol/abstract.cfm?uri=ol-4-6-161
    date: 2025-10-31
  serial-number:
    doi: 10.1364/OL.4.000161
    issn: 1539-4794
  note: "Publisher: Optica Publishing Group"
  abstract: The combined use of trapping and cooling laser beams for optical trapping and cooling of neutral atoms by the forces of resonance radiation pressure is examined. Calculations show that atoms can be held in traps as deep as 10−4 {eV} at temperatures of {~}10−3 K, close to the minimum set by quantum fluctuations. Spatial confinement of atoms to a region a fraction of a wavelength in length should be possible.
  parent:
    type: periodical
    title: Optics Letters
    issue: 6
    volume: 4
ferrari_collisional_1999:
  type: article
  title: Collisional relaxation in a fermionic gas
  author: Ferrari, Gabriele
  date: 1999-06-01
  page-range: R4125-R4128
  url:
    value: https://link.aps.org/doi/10.1103/PhysRevA.59.R4125
    date: 2025-10-31
  serial-number:
    doi: 10.1103/PhysRevA.59.R4125
  note: "Publisher: American Physical Society"
  abstract: We propose a method to study the degeneracy of a trapped atomic gas of fermions through the relaxation of the motion of a test particle. In the degenerate regime, and for an energy of the test particle well below the Fermi energy, we show that the Fermi-Dirac statistics is responsible for a strong decrease in the relaxation rate. This method can be used to directly measure the temperature of the fermionic gas.
  parent:
    type: periodical
    title: Physical Review A
    issue: 6
