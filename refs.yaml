marzari_maximally_1997:
  type: article
  title: Maximally localized generalized Wannier functions for composite energy bands
  author:
    - Marzari, Nicola
    - Vanderbilt, David
  date: 1997-11-15
  page-range: 12847-12865
  url:
    value: https://link.aps.org/doi/10.1103/PhysRevB.56.12847
    date: 2025-07-23
  serial-number:
    doi: 10.1103/PhysRevB.56.12847
  note: "Publisher: American Physical Society"
  abstract: We discuss a method for determining the optimally localized set of generalized Wannier functions associated with a set of Bloch bands in a crystalline solid. By “generalized Wannier functions” we mean a set of localized orthonormal orbitals spanning the same space as the specified set of Bloch bands. Although we minimize a functional that represents the total spread ∑𝑛〈𝑟2〉𝑛−〈𝐫〉2𝑛 of the Wannier functions in real space, our method proceeds directly from the Bloch functions as represented on a mesh of 𝑘 points, and carries out the minimization in a space of unitary matrices 𝑈(𝐤)mn describing the rotation among the Bloch bands at each 𝑘 point. The method is thus suitable for use in connection with conventional electronic-structure codes. The procedure also returns the total electric polarization as well as the location of each Wannier center. Sample results for Si, {GaAs}, molecular C2H4, and {LiCl} will be presented.
