haug_fast_2022:
  type: thesis
  title: Fast Typesetting with Incremental Compilation
  author: Haug, Martin
  date: 2022-06-15
  organization: Technical University of Berlin
  serial-number:
    doi: 10.13140/RG.2.2.15606.88642
  abstract: Text-based typesetting systems like {LATEX} compile source files into {PDF} and other formats. This process is computationally expensive. Unlike “What You See Is What You Get” ({WYSIWYG}) systems, most text-based typesetting systems recompile the document from scratch, even after minor changes. Constant expensive recomputations prevent instant preview of changes, as in {WYSIWYG} software. This thesis explores how to speed up the text-based typesetting software Typst by reusing artifacts from past compilations while parsing and layouting. We propose an incremental parsing algorithm that accommodates context-sensitive properties of markup languages such as the “off-side rule” and is suited for handwritten recursive descent parsers. Furthermore, we also present a constrained layout caching scheme that allows reusing previous layout elements even if the dimensions of their parent containers changed. In an evaluation based on a set of typical documents and edits, we determined that this thesis’ contributions increase the speed of Typst by a factor between 4.5 and 91. Compared with {LATEX}, Typst can compile an edit between 3.4 and 9895 times as fast.
madje_programmable_2022:
  type: thesis
  title: A Programmable Markup Language for Typesetting
  author: Mädje, Laurenz
  date: 2022-09-08
  organization: Technical University of Berlin
  url: https://laurmaedje.github.io/programmable-markup-language-for-typesetting.pdf
  abstract: Markup languages are well-suited for typesetting of structured documents. By separating content from presentation, they are more automatable and flexible than their visual (Wysiwyg) counterparts. {TEX}-based systems, which trace back to the 1970s, are still the state of the art in this domain. Due to {TEX}’s arcane macro system and poor error messages, these are hard to learn and use. More lightweight alternatives like Markdown and {AsciiDoc} fall short for complex typesetting while {XML}-based languages are too verbose for manual editing. This situation is unsatisfactory from a user experience perspective. For this reason, we present Typst, a new markup language with more expressive syntax and stronger computational foundations. By building on a type system with pure functions instead of macros, Typst eliminates many typical problems {TEX} suffers from. We show that Typst is highly automatable while being much easier to learn and use than current alternatives.
stoferle_molecules_2006:
  type: article
  title: Molecules of Fermionic Atoms in an Optical Lattice
  author:
    - Stöferle, Thilo
    - Moritz, Henning
    - Günter, Kenneth
    - Köhl, Michael
    - Esslinger, Tilman
  date: 2006-01-23
  page-range: "30401"
  url:
    value: https://link.aps.org/doi/10.1103/PhysRevLett.96.030401
    date: 2025-10-31
  serial-number:
    doi: 10.1103/PhysRevLett.96.030401
  note: "Publisher: American Physical Society"
  abstract: We create molecules from fermionic atoms in a three-dimensional optical lattice using a Feshbach resonance. In the limit of low tunneling, the individual wells can be regarded as independent three-dimensional harmonic oscillators. The measured binding energies for varying scattering length agree excellently with the theoretical prediction for two interacting atoms in a harmonic oscillator. We demonstrate that the formation of molecules can be used to measure the occupancy of the lattice and perform thermometry.
  parent:
    type: periodical
