    issue: 6653
    volume: 381
hasan_topological_2010:
  type: article
  title:
    value: Topological insulators
    short: Colloquium
  author:
    - Hasan, M. Z.
    - Kane, C. L.
  date: 2010-11-08
  page-range: 3045-3067
  url:
    value: https://link.aps.org/doi/10.1103/RevModPhys.82.3045
    date: 2025-11-17
  serial-number:
    doi: 10.1103/RevModPhys.82.3045
  note: "Publisher: American Physical Society"
  abstract: Topological insulators are electronic materials that have a bulk band gap like an ordinary insulator but have protected conducting states on their edge or surface. These states are possible due to the combination of spin-orbit interactions and time-reversal symmetry. The two-dimensional (2D) topological insulator is a quantum spin Hall insulator, which is a close cousin of the integer quantum Hall state. A three-dimensional (3D) topological insulator supports novel spin-polarized 2D Dirac fermions on its surface. In this Colloquium the theoretical foundation for topological insulators and superconductors is reviewed and recent experiments are described in which the signatures of topological insulators have been observed. Transport experiments on Hg⁢Te/Cd⁢Te quantum wells are described that demonstrate the existence of the edge states predicted for the quantum spin Hall insulator. Experiments on Bi1−𝑥⁢Sb𝑥, Bi2⁢Se3, Bi2⁢Te3, and Sb2⁢Te3 are then discussed that establish these materials as 3D topological insulators and directly probe the topology of their surface states. Exotic states are described that can occur at the surface of a 3D topological insulator due to an induced energy gap. A magnetic gap leads to a novel quantum Hall state that gives rise to a topological magnetoelectric effect. A superconducting energy gap leads to a state that supports Majorana fermions and may provide a new venue for realizing proposals for topological quantum computation. Prospects for observing these exotic states are also discussed, as well as other potential device applications of topological insulators.
  parent:
    type: periodical
    title: Reviews of Modern Physics
    issue: 4
    volume: 82
