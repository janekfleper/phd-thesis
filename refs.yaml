schneider_ab-initio_2009:
  type: article
  title: Ab-initio determination of Bose-Hubbard parameters for two ultracold atoms in an optical lattice using a three-well potential
  author:
    - Schneider, Philipp-Immanuel
    - Grishkevich, Sergey
    - Saenz, Alejandro
  date: 2009-07-06
  page-range: "13404"
  url:
    value: http://arxiv.org/abs/0903.3185
    date: 2020-02-13
  serial-number:
    arxiv: "0903.3185"
    doi: 10.1103/PhysRevA.80.013404
    issn: 1050-2947, 1094-1622
  abstract: We calculate numerically the exact energy spectrum of the six dimensional problem of two interacting Bosons in a three-well optical lattice. The particles interact via a full Born-Oppenheimer potential which can be adapted to model the behavior of the s-wave scattering length at Feshbach resonances. By adjusting the parameters of the corresponding Bose-Hubbard ({BH}) Hamiltonian the deviation between the numerical energy spectrum and the {BH} spectrum is minimized. This defines the optimal {BH} parameter set which we compare to the standard parameters of the {BH} model. The range of validity of the {BH} model with these parameter sets is examined, and an improved analytical prediction of the interaction parameter is introduced. Furthermore, an extended {BH} model and implications due to the energy dependence of the scattering length and couplings to higher Bloch bands at a Feshbach resonance are discussed.
  parent:
    type: periodical
    title: Physical Review A
    issue: 1
    volume: 80
