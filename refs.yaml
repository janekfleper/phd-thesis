  date: 1986-06-01
  page-range: 189-193
  url:
    value: https://doi.org/10.1007/BF01303701
    date: 2020-12-19
  serial-number:
    doi: 10.1007/BF01303701
    issn: 1431-584X
  abstract: Metallic, oxygen-deficient compounds in the Ba−La−Cu−O system, with the composition {BaxLa}5−{xCu}5O5(3−y) have been prepared in polycrystalline form. Samples withx=1 and 0.75,y{>}0, annealed below 900°C under reducing conditions, consist of three phases, one of them a perovskite-like mixed-valent copper compound. Upon cooling, the samples show a linear decrease in resistivity, then an approximately logarithmic increase, interpreted as a beginning of localization. Finally an abrupt decrease by up to three orders of magnitude occurs, reminiscent of the onset of percolative superconductivity. The highest onset temperature is observed in the 30 K range. It is markedly reduced by high current densities. Thus, it results partially from the percolative nature, bute possibly also from 2D superconducting fluctuations of double perovskite layers of one of the phases present.
