    title: Applied Sciences
    issue: 20
    volume: 14
nurnberg_bulk_2015:
  type: article
  title: Bulk damage and absorption in fused silica due to high-power laser applications
  author:
    - Nürnberg, Frank
    - Kühn, Bodo
    - Langner, Andreas
    - Altwein, Mark
    - Schötz, Gerhard
    - Takke, R.
    - Thomas, Stephan
    - Vydra, J.
  date: 2015-11-23
  page-range: "96321"
  serial-number:
    doi: 10.1117/12.2194289
  abstract: Laser fusion projects are heading for {IR} optics with high broadband transmission, high shock and temperature resistance, long laser durability, and best purity. For this application, fused silica is an excellent choice. The energy density threshold on {IR} laser optics is mainly influenced by the purity and homogeneity of the fused silica. The absorption behavior regarding the hydroxyl content was studied for various synthetic fused silica grades. The main absorption influenced by {OH} vibrational excitation leads to different {IR} attenuations for {OH}-rich and low-{OH} fused silica. Industrial laser systems aim for the maximum energy extraction possible. Heraeus Quarzglas developed an Yb-doped fused silica fiber to support this growing market. But the performance of laser welding and cutting systems is fundamentally limited by beam quality and stability of focus. Since absorption in the optical components of optical systems has a detrimental effect on the laser focus shift, the beam energy loss and the resulting heating has to be minimized both in the bulk materials and at the coated surfaces. In collaboration with a laser research institute, an optical finisher and end users, photo thermal absorption measurements on coated samples of different fused silica grades were performed to investigate the influence of basic material properties on the absorption level. High purity, synthetic fused silica is as well the material of choice for optical components designed for {DUV} applications (wavelength range 160 nm - 260 nm). For higher light intensities, e.g. provided by Excimer lasers, {UV} photons may generate defect centers that effect the optical properties during usage, resulting in an aging of the optical components ({UV} radiation damage). Powerful Excimer lasers require optical materials that can withstand photon energy close to the band gap and the high intensity of the short pulse length. The {UV} transmission loss is restricted to the {DUV} wavelength range below 300 nm and consists of three different absorption bands centered at 165 nm (peroxy radicals), 215 nm (E’-center), and 265 nm (non-bridging oxygen hole center ({NBOH})), which change the transmission behavior of material. © (2015) {COPYRIGHT} Society of Photo-Optical Instrumentation Engineers ({SPIE}). Downloading of the abstract is permitted for personal use only.
  parent:
    type: proceedings
gyger_continuous_2024:
  type: article
  title: Continuous operation of large-scale atom arrays in optical lattices
  author:
    - Gyger, Flavien
    - Ammenwerth, Maximilian
    - Tao, Renhao
    - Timme, Hendrik
    - Snigirev, Stepan
    - Bloch, Immanuel
    - Zeiher, Johannes
  date: 2024-07-25
  page-range: "33104"
  url:
    value: https://link.aps.org/doi/10.1103/PhysRevResearch.6.033104
    date: 2025-10-25
  serial-number:
    doi: 10.1103/PhysRevResearch.6.033104
  note: "Publisher: American Physical Society"
  abstract: Scaling the size of assembled neutral-atom arrays trapped in optical lattices or optical tweezers is an enabling step for a number of applications ranging from quantum simulations to quantum metrology. However, preparation times increase with system size and constitute a severe bottleneck in the bottom-up assembly of large ordered arrays from stochastically loaded optical traps. Here we demonstrate a method to circumvent this bottleneck by recycling atoms from one experimental run to the next, while continuously reloading and adding atoms to the array. Using this approach, we achieve densely packed arrays with more than 1000 atoms stored in an optical lattice, continuously refilled with a 3.5 s cycle time and about 130 atoms reloaded during each cycle. Furthermore, we show that we can continuously maintain such large arrays by simply reloading atoms that are lost from one cycle to the next. Our approach paves the way towards quantum science with large ordered atomic arrays containing thousands of atoms in continuous operation.
  parent:
    type: periodical
    title: Physical Review Research
    issue: 3
    volume: 6
dirac_theory_1926:
  type: article
  title: On the theory of quantum mechanics
  author: Dirac, Paul Adrien Maurice
  date: 1926-10-01
  page-range: 661-677
  url:
    value: https://royalsocietypublishing.org/doi/10.1098/rspa.1926.0133
    date: 2025-10-27
  serial-number:
    doi: 10.1098/rspa.1926.0133
  note: "Publisher: Royal Society"
  abstract: The new mechanics of the atom introduced by Heisenberg may be based on the assumption that the variables that describe a dynamical system do not obey the commutative law of multiplication, but satisfy instead certain quantum conditions. One can build up a theory without knowing anything about the dynamical variables except the algebraic laws that they are subject to, and can show that they may be represented by matrices whenever a set of uniformising variables for the dynamical system exists. It may be shown, however (see 3), that there is no set of uniformising variables for a system containing more than one electron, so that the theory cannot progress very far on these lines. A new development of the theory has recently been given by Schrödinger. Starting from the idea that an atomic system cannot be represented by a trajectory, i. e., by a point moving through the co-ordinate space, but must be represented by a wave in this space, Schrödinger obtains from a variation prin­ciple a differential equation which the wave function ψ must satisty. This differential equation turns out to be very closely connected with the Hamiltonian equation which specifies the system, namely, if H (qr, Pr - W = 0 is the Hamiltonian equation of the system, where the qr, Pr are canonical variables, then the wave equation for ψ is \{H(q r, ih ∂/∂q) - W\} ψ = 0.
  parent:
    type: periodical
    title: Proceedings of the Royal Society of London. Series A, Containing Papers of a Mathematical and Physical Character
    issue: 762
    volume: 112
fermi_zur_1926:
  type: article
  title: Zur Quantelung des idealen einatomigen Gases
  author: Fermi, E.
  date: 1926-11-01
  page-range: 902-912
  url:
    value: https://doi.org/10.1007/BF01400221
    date: 2025-10-27
  serial-number:
    doi: 10.1007/BF01400221
    issn: 0044-3328
  abstract: Wenn der Nernstsche Wärmesatz auch, für das ideale Gas seine Gültigkeit behalten soll, muß man annehmen, daß die Gesetze idealer Gase bei niedrigen Temperaturen von den klassischen abweichen. Die Ursache dieser Entartung ist in einer Quantelung der Molekularbewegungen zu suchen. Bei allen Theorien der Entartung werden immer mehr oder weniger willkürliche Annahmen über das statistische Verhalten der Moleküle, oder über ihre Quantelung gemacht. In der vorliegenden Arbeit wird nur die von Pauli zuerst ausgesprochene und auf zahlreiche spektroskopische Tatsachen begründete Annahme benutzt, daß in einem System nie zwei gleichwertige Elemente vorkommen können, deren Quantenzahlen vollständig übereinstimmen. Mit dieser Hypothese werden die Zustandsgieichung und die innere Energie des idealen Gases abgeleitet; der Entropiewert für große Temperaturen stimmt mit dem Stern-Tetrodeschen überein.
  parent:
