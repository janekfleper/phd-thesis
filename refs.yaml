  abstract: A system of particles in a double well potential is a widely studied and useful example for understanding quantum mechanics. This simple system has recently been used in theoretical proposals and related experiments as a way to make quantum logic gates for ultracold atoms confined in optical lattices. Such quantum gates are the fundamental building blocks for quantum information processing; in these proposals, a regular array of cold atoms in an optical lattice serves as the quantum register. We explain how this research can be understood in terms of well-known principles for systems of identical particles.
