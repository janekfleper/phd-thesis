xygkis_absorption_2023:
  type: misc
  title: Absorption coefficients and scattering losses of {TGG}, {TGP}, {KTF}, {FS}, and {CeF}₃ magneto-optic crystals in the visible via cavity ring down spectroscopy
  author:
    - Xygkis, Michail
    - Linaraki, Artemis
    - Toutoudaki, Eirini
    - Katsoprinakis, Giorgos
    - Rakitzis, T. Peter
  date: 2023-03-21
  publisher: Optica Open
  url:
    value: https://preprints.opticaopen.org/articles/preprint/Absorption_coefficients_and_scattering_losses_of_TGG_TGP_KTF_FS_and_CeF_magneto-optic_crystals_in_the_visible_via_cavity_ring_down_spectroscopy/22303453/1
    date: 2025-08-21
  serial-number:
    doi: 10.1364/opticaopen.22303453.v1
  abstract: We demonstrate a method for determining small absorption coefficients and surface scattering losses of crystals using cavity ring down spectroscopy, and perform measurements on crystals of {TGG}, {TGP}, {FS}, {KTF}, and {CeF}₃, at 532nm and 634nm. We separate the surface-scattering and absorption losses by using crystals of different length. The measurements differ from those in the literature, especially for small absorption coefficients. We define a figure of merit ({FoM}) for magneto-optic crystals in signal-reversing cavity-ringdown polarimetry, which depends on the cavity losses, and on the crystal Verdet constant and absorption coefficient, and use it to evaluate the crystals for suitability for intra-cavity applications. We show that {TGP} has a significantly higher {FoM} compared to the other crystals, for crystal lengths up to 16 mm, whereas {CeF}₃ and {FS} outperform {TGP} for longer crystals.
