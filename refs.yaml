vlasova_absorption_2024:
  type: article
  title: Absorption Measurement in Ultrapure Crystalline Quartz with the Eliminated Influence of Ambient Air Absorption in the Time-Resolved Photothermal Common-Path Interferometry Scheme
  author:
    - Vlasova, Ksenia
    - Makarov, Alexandre
    - Andreev, Nikolai
  date: 2024-01
  page-range: "9474"
  url:
    value: https://www.mdpi.com/2076-3417/14/20/9474
    date: 2025-10-24
  serial-number:
    doi: 10.3390/app14209474
    issn: 2076-3417
  note: "Publisher: Multidisciplinary Digital Publishing Institute"
  abstract: We demonstrate measurements of the absorption coefficient α ≈ 2.5 × 10−7 cm−1 in synthetic crystalline quartz at a wavelength of 1071 nm with a signal-to-noise ratio of 10/1 using the Time-resolved photothermal common-path interferometry ({TPCI}) scheme. It utilized cells filled with flowing argon and eliminated the influence of ambient air absorption. The scheme elements limiting the sensitivity of measurements at the level of ≈7.8 × 10−8 cm−1 were revealed. When these elements are replaced by better ones in terms of their thermal influence, the sensitivity of absorption coefficient measurements in crystalline quartz is {~}10−8 cm−1. The calculation of the correction due to these optical elements of the values of the measured absorption coefficients is also described, which makes it possible to achieve the same sensitivity without replacing the elements. The improved scheme confirms the presence of the spatial inhomogeneity of absorption with a minimum coefficient of 2.5 × 10−7 cm−1 in synthetic crystalline quartz. The discrepancy of the absorption coefficient values in different regions of the crystal in the presented series of experiments was 2.5 × 10−7 cm−1 to 4 × 10−6 cm−1. Taking into account the ratio of thermo-optical parameters and the heat diffusion effect, the calculation shows that for quartz glasses the corresponding sensitivity of the absorption coefficient measurements equals ≈1.5 × 10−9 cm−1.
