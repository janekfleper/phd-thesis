  date: 2005-05
  page-range: "5285"
  url:
    value: https://doi.org/10.1088/0305-4470/38/23/014
    date: 2025-11-03
  serial-number:
    doi: 10.1088/0305-4470/38/23/014
    issn: 0305-4470
  abstract: Off-diagonal long-range order ({ODLRO}) which is believed to be one characteristic of superconductivity is a quantum phenomenon not describable in classical mechanical terms. The quantum state constructed by η-pairing demonstrates {ODLRO}. Entanglement is a key concept of the quantum information processing and has no classical counterpart. We study the entanglement property of the η-pairing quantum state by concurrence and entropy which are two measures of the entanglement. We show that the concurrence of entanglement between one-site and the rest sites is exactly the correlation function of the {ODLRO} for the η-pairing state in the thermodynamic limit. So, when the η-pairing state is entangled, it demonstrates {ODLRO} and is thus in the superconducting phase, if it is a separable state, there is no {ODLRO}. In the thermodynamical limit, the entanglement between the M-site and other sites of the η-pairing state does not vanish. Other types of {ODLRO} of the η-pairing state are presented. We show that the behaviour of the {ODLRO} correlation functions is equivalent to that of the entanglement of the η-pairing state. The scaling of the entropy of the entanglement for the η-pairing state is studied.
